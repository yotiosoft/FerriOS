[workspace]
resolver = "3"
members = ["abi", "kernel", "userlib", "tools/mkfs", "user/*"]

[package]
name = "ferrios-runner"
version = "0.1.0"
edition = "2024"

[features]
debug_mode = []

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[build-dependencies]
bootloader = { version = "0.11.17", default-features = false, features = ["bios"] }
serde_json = "1.0"
