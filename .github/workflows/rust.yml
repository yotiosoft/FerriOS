name: Rust

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Prepare
      run: |
        sudo apt-get update
        sudo apt-get install qemu-system
        rustup toolchain install nightly-2026-02-14 --profile minimal --component rust-src --component llvm-tools-preview --target x86_64-unknown-none
        rustup default nightly-2026-02-14
        rustup show active-toolchain
    - name: Build
      run: cargo build --verbose --release
    - name: Run tests
      run: ./test.sh
      
